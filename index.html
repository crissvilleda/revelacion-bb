<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Revelación</title>
    <!-- Agregamos la biblioteca de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #ff9fcf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        body.countdown-active {
            background: white;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        .card {
            background: linear-gradient(to bottom, #fff8f8, #f0f8ff);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            transition: all 0.5s ease;
            border: 3px dashed;
            border-image: linear-gradient(45deg, #74b9ff, #fd79a8) 1;
        }

        .card h1 {
            background: linear-gradient(45deg, #74b9ff, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .card p {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .reveal-btn {
            background: linear-gradient(45deg, #74b9ff, #fd79a8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .reveal-btn:hover {
            background: linear-gradient(45deg, #0984e3, #e84393);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .countdown {
            font-size: 8rem;
            font-weight: bold;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            animation: color-change 1s linear infinite alternate;
            transform-origin: center;
        }

        @keyframes color-change {
            0% {
                color: #74b9ff;
            }

            100% {
                color: #fd79a8;
            }
        }

        @keyframes pulse-animation {
            0% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.15);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .countdown-message {
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            width: 80%;
            max-width: 800px;
            text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.1);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .highlight-blue {
            color: #74b9ff;
            text-shadow: 1px 1px 3px rgba(116, 185, 255, 0.5);
        }

        .highlight-pink {
            color: #fd79a8;
            text-shadow: 1px 1px 3px rgba(253, 121, 168, 0.5);
        }

        .reveal-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .reveal-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffd6e7 100%);
            z-index: 15;
            animation: bg-change 5s infinite alternate;
        }

        @keyframes bg-change {
            0% { background: linear-gradient(135deg, #ffe6f2 0%, #ffd6e7 100%); }
            100% { background: linear-gradient(135deg, #ffcce0 0%, #ffb6d3 100%); }
        }

        .reveal-message h1 {
            font-size: 5rem;
            color: #fd79a8;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px rgba(253, 121, 168, 0.3);
            animation: pulse 2s infinite;
            position: relative;
            z-index: 50;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .reveal-message p {
            font-size: 2rem;
            color: #fd79a8;
            margin-top: 0;
            text-shadow: 1px 1px 0px rgba(253, 121, 168, 0.2);
            position: relative;
            z-index: 50;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .reveal-content {
            background-color: white;
            border-radius: 20px;
            padding: 30px 40px;
            box-shadow: 0 5px 25px rgba(253, 121, 168, 0.2);
            text-align: center;
            position: relative;
            z-index: 50;
            max-width: 90%;
            border: 3px solid #fd79a8;
            border-style: dotted;
        }

        .reveal-image {
            width: 200px;
            height: auto;
            margin: 20px auto;
            display: block;
            animation: subtle-glow 3s ease-in-out infinite;
            position: relative;
            z-index: 50;
            border-radius: 15px;
        }

        @keyframes subtle-glow {
            0% { 
                filter: drop-shadow(0 0 3px rgba(253, 121, 168, 0.4));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 7px rgba(253, 121, 168, 0.6));
                transform: scale(1.02);
            }
            100% { 
                filter: drop-shadow(0 0 3px rgba(253, 121, 168, 0.4));
                transform: scale(1);
            }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Estilos para el confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 60;
            animation: confetti-fall 5s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                top: -5%;
                transform: rotate(0deg) translateX(0);
                opacity: 1;
            }

            100% {
                top: 100%;
                transform: rotate(360deg) translateX(calc(20vw * var(--drift)));
                opacity: 0;
            }
        }

        .flower {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 40;
            opacity: 0;
            animation: fall 10s linear infinite, rotate 10s linear infinite;
        }

        @keyframes fall {
            0% {
                top: -20%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 120%;
                opacity: 0;
            }
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hearts-container {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 30;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23fd79a8' d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            animation: float 6s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-800px) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 80px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 700'%3E%3Cpath fill='%23fd79a8' d='M250,0 C350,0 450,100 450,250 C450,400 350,550 250,550 C150,550 50,400 50,250 C50,100 150,0 250,0 Z'%3E%3C/path%3E%3Cpath fill='%23666' d='M250,550 L260,700 L240,700 L250,550 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 35;
            animation: balloon-float 15s ease-in infinite;
        }

        @keyframes balloon-float {
            0% {
                transform: translate(0, 100vh);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translate(calc(20vw - 40px), -100px);
                opacity: 0;
            }
        }

        .butterfly {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fd79a8' d='M50,30 C60,10 85,5 90,25 C95,45 70,50 50,30 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M50,30 C40,10 15,5 10,25 C5,45 30,50 50,30 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M50,30 L50,60 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M40,65 C50,55 50,55 60,65 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 35;
            animation: butterfly-fly 20s linear infinite;
        }

        @keyframes butterfly-fly {
            0% {
                transform: translate(-100px, 50vh) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 0.9;
            }

            45% {
                transform: translate(30vw, 30vh) scale(1.2) rotate(20deg);
            }

            50% {
                transform: translate(50vw, 40vh) scale(1) rotate(-20deg);
            }

            80% {
                transform: translate(80vw, 20vh) scale(1.2) rotate(20deg);
                opacity: 0.9;
            }

            100% {
                transform: translate(120vw, 10vh) scale(0.8) rotate(-20deg);
                opacity: 0;
            }
        }

        .ribbon {
            position: absolute;
            width: 40px;
            height: 150px;
            background-color: #fd79a8;
            opacity: 0;
            z-index: 25;
            transform-origin: center top;
            animation: ribbon-fall 8s ease-in infinite;
        }

        @keyframes ribbon-fall {
            0% {
                transform: translateY(-150px) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .cloud {
            position: absolute;
            width: 150px;
            height: 80px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'%3E%3Cpath fill='%23fff' d='M20,70 Q0,70 0,50 Q0,30 20,30 Q30,5 60,20 Q80,0 110,20 Q130,5 150,20 Q185,15 190,40 Q200,50 190,70 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0.7;
            z-index: 20;
            animation: cloud-float 40s linear infinite;
        }

        @keyframes cloud-float {
            0% {
                transform: translateX(-200px);
                opacity: 0;
            }

            10% {
                opacity: 0.7;
            }

            90% {
                opacity: 0.7;
            }

            100% {
                transform: translateX(calc(100vw + 200px));
                opacity: 0;
            }
        }

        /* Agregamos un canvas para el confeti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 70;
            pointer-events: none;
        }

        /* Estilos para el mensaje de bienvenida con animación */
        .welcome-message {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fff9f9 0%, #f0f8ff 100%);
            z-index: 90;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            color: #333;
            font-size: 1.3rem;
            line-height: 1.8;
            overflow: hidden;
            box-sizing: border-box; /* Asegura que el padding no afecte el ancho total */
        }

        .welcome-content {
            max-width: 700px;
            position: relative;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: white;
            border: 3px dashed;
            border-image: linear-gradient(45deg, #74b9ff, #fd79a8) 1;
            width: 90%; /* Asegura que use el 90% del ancho disponible en contenedor padre */
            box-sizing: border-box; /* Asegura que el padding no afecte el ancho total */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-text {
            display: inline;
        }

        .welcome-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
            margin-right: 3px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .welcome-emoji {
            display: inline-block;
            opacity: 0;
            transform: scale(0);
            margin: 0 3px;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .welcome-emoji.visible {
            opacity: 1;
            transform: scale(1.2) rotate(10deg);
        }

        .welcome-word.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .welcome-line {
            margin-bottom: 15px;
            position: relative;
        }

        .sparkle {
            position: absolute;
            width: 20px;
            height: 20px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23ffcc00' d='M50 0 L60 40 L100 50 L60 60 L50 100 L40 60 L0 50 L40 40 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            animation: sparkle-anim 2s linear infinite;
            z-index: 1;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes sparkle-anim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: scale(1.5) rotate(90deg);
                opacity: 0;
            }
        }

        /* Media queries para responsividad del mensaje de bienvenida */
        @media (max-width: 768px) {
            .welcome-message {
                padding: 10px;
                display: none; /* Inicialmente oculto, se cambiará con JS */
                align-items: center;
                justify-content: center;
            }
            
            .welcome-content {
                padding: 25px;
                max-width: 90%;
                width: 90%;
                margin: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .welcome-message {
                padding: 10px;
                font-size: 1.1rem;
                line-height: 1.6;
                display: none; /* Inicialmente oculto, se cambiará con JS */
                align-items: center;
                justify-content: center;
            }
            
            .welcome-content {
                padding: 15px;
                max-width: 95%;
                width: 95%;
                margin: auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .welcome-line {
                margin-bottom: 15px;
                line-height: 1.4;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.2rem;
            }
        }

        /* Media queries para responsividad general */
        @media (max-width: 768px) {
            .card {
                padding: 30px;
                max-width: 90%;
                width: 90%;
            }

            .card h1 {
                font-size: 2rem;
            }

            .card p {
                font-size: 1rem;
                margin-bottom: 20px;
            }

            .reveal-btn {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .countdown {
                font-size: 6rem;
            }

            .countdown-message {
                font-size: 1.2rem;
                width: 90%;
                top: 60%;
            }

            .reveal-content {
                padding: 25px;
                max-width: 85%;
            }

            .reveal-message h1 {
                font-size: 3.5rem;
            }

            .reveal-message p {
                font-size: 1.5rem;
            }

            .reveal-image {
                width: 150px;
            }

            .flower,
            .heart,
            .balloon,
            .butterfly,
            .ribbon {
                transform-origin: center;
                transform: scale(0.8);
            }
            
            .welcome-content {
                padding: 25px;
                max-width: 90%;
                width: 90%;
                box-sizing: border-box;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
                max-width: 95%;
                width: 95%;
                box-sizing: border-box;
            }

            .card h1 {
                font-size: 1.8rem;
            }

            .card p {
                font-size: 1rem;
                margin-bottom: 15px;
            }

            .reveal-btn {
                padding: 10px 20px;
                font-size: 1rem;
            }

            .countdown {
                font-size: 5rem;
            }

            .countdown-message {
                font-size: 1rem;
                width: 95%;
                top: 65%;
                line-height: 1.5;
            }

            .reveal-content {
                padding: 20px;
                max-width: 95%;
            }

            .reveal-message h1 {
                font-size: 2.5rem;
                margin-bottom: 10px;
            }

            .reveal-message p {
                font-size: 1.2rem;
            }

            .reveal-image {
                width: 120px;
                margin: 10px auto;
            }

            .flower,
            .heart,
            .balloon,
            .butterfly,
            .ribbon {
                transform: scale(0.6);
            }

            .cloud {
                transform: scale(0.6);
            }
            
            .welcome-content {
                padding: 15px;
                max-width: 95%;
                width: 95%;
                box-sizing: border-box;
                margin: 0 auto;
            }
            
            .welcome-line {
                margin-bottom: 15px;
                line-height: 1.4;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.2rem;
            }
        }

        /* Para pantallas muy pequeñas */
        @media (max-width: 360px) {
            .welcome-content {
                padding: 12px;
                width: 98%;
                max-width: 98%;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.1rem;
            }
            
            .card {
                padding: 15px;
                width: 98%;
                max-width: 98%;
            }
        }

        /* Para orientación landscape en móviles */
        @media (max-height: 500px) and (orientation: landscape) {
            .welcome-content {
                padding: 15px;
                max-width: 85%;
                width: 85%;
                margin: 0 auto;
                max-height: 85vh;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1rem;
            }
            
            .welcome-line {
                margin-bottom: 10px;
                line-height: 1.3;
            }
        }

        /* Para tablets en portrait */
        @media (min-width: 481px) and (max-width: 820px) and (orientation: portrait) {
            .welcome-content {
                max-width: 85%;
                width: 85%;
                padding: 25px;
            }
            
            .welcome-word, .welcome-emoji {
                font-size: 1.3rem;
            }
        }

        /* Para asegurar que siempre sea visible sin scroll en cualquier dispositivo */
        .welcome-content {
            overflow: visible;
            margin: auto;
        }

        .gradient-text {
            background: linear-gradient(45deg, #74b9ff, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>Mi Revelación</h1>
            <p>Haz clic en el botón para descubrir una sorpresa muy especial</p>
            <button class="reveal-btn">Revelar</button>
        </div>
    </div>

    <div class="countdown" id="countdown"></div>

    <div class="countdown-message" id="countdownMessage"></div>

    <!-- Agregamos el contenedor del mensaje de bienvenida -->
    <div class="welcome-message" id="welcomeMessage">
        <div class="welcome-content" id="welcomeContent">
            <!-- El contenido se generará dinámicamente con JavaScript -->
        </div>
    </div>

    <div class="reveal-message" id="revealMessage">
        <div class="reveal-background"></div>
        <div class="reveal-content">
            <h1>¡Soy Niña!</h1>
            <img src="imagen.jpg" alt="Niña feliz" class="reveal-image">
            <p>💕 ¡Una princesita viene en camino! 💕</p>
        </div>
    </div>

    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Agregamos un canvas para el confeti -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // Limpiar cualquier animación o elemento previo al cargar la página
        window.onload = function () {
            // Reiniciar todos los elementos a su estado inicial
            resetAnimation();
        };

        const revealBtn = document.querySelector('.reveal-btn');
        const card = document.querySelector('.card');
        const countdown = document.getElementById('countdown');
        const revealMessage = document.getElementById('revealMessage');

        // Configuración del confeti con colores para niña
        const confettiColors = [
            '#fd79a8', // Rosa
            '#f8a5c2', // Rosa claro
            '#e84393', // Rosa fuerte
            '#fab1a0', // Coral
            '#ff9ff3', // Rosa pastel

        // Función para lanzar confeti en cascada
        function runConfettiShower() {
            // Crear una instancia de confeti
            const myConfetti = confetti.create(document.getElementById('confetti-canvas'), {
                resize: true,
                useWorker: true
            });

            // Duración total de la animación en milisegundos
            const animationDuration = 8000;
            // Intensidad del confeti (ajustar según tamaño de pantalla)
            const intensity = window.innerWidth < 768 ? 60 : 80;
            // Ajustar cantidad de partículas según tamaño de pantalla
            const particleMultiplier = window.innerWidth < 768 ? 0.7 : 1;

            // Función para crear una explosión de confeti
            function fireConfetti(particleRatio, opts) {
                myConfetti({
                    particleCount: Math.floor(200 * particleRatio * particleMultiplier),
                    spread: window.innerWidth < 768 ? 80 : 100,
                    origin: { y: 0.6 },
                    colors: confettiColors,
                    ...opts
                });
            }

            // Explosión inicial grande
            fireConfetti(1, {
                spread: 180,
                startVelocity: 45,
                gravity: 1,
                scalar: 1.2,
                drift: 0,
                ticks: 300
            });

            // Más confeti desde arriba
            setTimeout(() => {
                fireConfetti(0.5, {
                    spread: 120,
                    startVelocity: 35,
                    decay: 0.91,
                    scalar: 0.8,
                    origin: { y: 0 }
                });
            }, 200);

            // Confeti desde la izquierda
            setTimeout(() => {
                fireConfetti(0.3, {
                    spread: 120,
                    startVelocity: 45,
                    decay: 0.92,
                    scalar: 1,
                    origin: { x: 0, y: 0.5 }
                });
            }, 400);

            // Confeti desde la derecha
            setTimeout(() => {
                fireConfetti(0.3, {
                    spread: 120,
                    startVelocity: 45,
                    decay: 0.92,
                    scalar: 1,
                    origin: { x: 1, y: 0.5 }
                });
            }, 600);

            // Explosión central con más confeti
            setTimeout(() => {
                fireConfetti(0.7, {
                    spread: 140,
                    decay: 0.91,
                    scalar: 1.2,
                    origin: { y: 0.5 }
                });
            }, 1000);

            // Explosión final
            setTimeout(() => {
                fireConfetti(0.6, {
                    spread: 160,
                    decay: 0.91,
                    scalar: 1.2
                });
            }, 2500);

            // Confeti continuo durante toda la duración
            let intervalId = setInterval(() => {
                fireConfetti(0.1, {
                    spread: 120,
                    startVelocity: 30,
                    decay: 0.92,
                    scalar: 0.7,
                    origin: { y: Math.random() - 0.2, x: Math.random() }
                });
            }, 200);

            // Detener el confeti después de la duración establecida
            setTimeout(() => {
                clearInterval(intervalId);
                // Usar el método stop() para limpiar partículas restantes
                setTimeout(() => {
                    myConfetti.reset();
                }, 3000);
            }, animationDuration);
        }

        revealBtn.addEventListener('click', () => {

        // Función para mostrar el mensaje de bienvenida
        function showWelcomeMessage() {
            card.style.opacity = 0;
            setTimeout(() => {
                card.style.display = 'none';
                const welcomeMessage = document.getElementById('welcomeMessage');
                const welcomeContent = document.getElementById('welcomeContent');

                // El texto completo con emojis, dividido en 4 grupos
                const textGroups = [
                    // Grupo 1
                    [
                        "¡Hola familia! 👋👶",
                        "Muy pronto llegaré a formar parte de esta hermosa familia. ✨💖",
                        "Mis papitos están muy emocionados por conocerme y saber si soy una niña o un niño. 🤰🤱"
                    ],
                    // Grupo 2
                    [
                        "Ellos ya quieren saber cómo serán mis ojitos, mi sonrisa... 👀😊",
                        "Ya quieren abrazarme, llenarme de besos y consentirme muchoooo. 🤗💕",
                        "Yo estoy muy feliz, ya quiero conocerlos para jugar con mis primitos, mis tíos y mis abuelitos. 🥰👨‍👩‍👧‍👦"
                    ],
                    // Grupo 3
                    [
                        "¿Están listos para saber quién soy? 🤔💭",
                        "Mi mamita dice que si soy niña me hará muchos peinados y me pondrá muchos vestiditos. 👗💇‍♀️",
                        "También jugaremos a la cocinita y a las muñecas. 🧸🍳",
                        "Mi papito dice que si soy niño me enseñará a jugar fútbol y a montar bicicleta. ⚽🚲"
                    ],
                    // Grupo 4
                    [
                        "Ya me falta poquito para iluminar sus vidas y los días de cada uno. ☀️✨",
                        "¡Ahora sí! ¡Llegó la hora de saber quién soy! 🎉🎊",
                        "¿Están listos?",
                        "¡Ayúdenme a contar! 🔢❤️"
                    ]
                ];

                // Limpiar contenido previo
                welcomeContent.innerHTML = '';

                // Mostrar el contenedor
                welcomeMessage.style.display = 'flex';

                // Variable para seguir el grupo actual
                let currentGroup = 0;

                // Función para procesar y mostrar un grupo de texto
                function showTextGroup(groupIndex) {
                    // Si ya mostramos todos los grupos, pasar a la cuenta regresiva
                    if (groupIndex >= textGroups.length) {
                        // Mostrar solo la última línea destacada
                        highlightLastLine();
                        return;
                    }
                    
                    // Detectar si es dispositivo móvil
                    const isMobile = window.innerWidth <= 480;
                    const isSmallMobile = window.innerWidth <= 360;
                    
                    // Limpiar contenido anterior con una transición
                    if (groupIndex > 0) {
                        // Ocultar con animación el contenido actual
                        const existingLines = welcomeContent.querySelectorAll('.welcome-line');
                        existingLines.forEach(line => {
                            line.style.opacity = '0';
                            line.style.transform = 'translateY(-20px)';
                            // Transición más rápida en móviles
                            line.style.transition = `opacity ${isMobile ? '0.5s' : '0.6s'} ease, transform ${isMobile ? '0.5s' : '0.6s'} ease`;
                        });
                        
                        // Después de la animación, limpiar y mostrar nuevo grupo
                        setTimeout(() => {
                            welcomeContent.innerHTML = '';
                            processAndAnimateGroup(groupIndex);
                        }, isMobile ? 500 : 600);
                    } else {
                        // Es el primer grupo, mostrar directamente
                        processAndAnimateGroup(groupIndex);
                    }
                }
                
                // Función para procesar un grupo y animar sus palabras
                function processAndAnimateGroup(groupIndex) {
                    // Detectar si es dispositivo móvil
                    const isMobile = window.innerWidth <= 480;
                    const isSmallMobile = window.innerWidth <= 360;
                    
                    // Ajustar el contenedor para mejor visibilidad en móviles
                    if (isMobile) {
                        welcomeContent.style.maxHeight = '85vh';
                        welcomeContent.style.height = 'auto';
                        welcomeContent.style.display = 'flex';
                        welcomeContent.style.flexDirection = 'column';
                        welcomeContent.style.justifyContent = 'center';
                        welcomeContent.style.alignItems = 'center';
                        welcomeContent.style.padding = isSmallMobile ? '12px' : '15px';
                        welcomeContent.style.boxSizing = 'border-box';
                        welcomeContent.style.width = isSmallMobile ? '95%' : '90%';
                        welcomeContent.style.margin = '0 auto';
                    }
                    
                    const lines = textGroups[groupIndex];
                    
                    // Extraer emojis usando regex
                    const emojiRegex = /[\p{Emoji}]/gu;
                    
                    // Convertir cada línea en elementos HTML
                    lines.forEach((line, lineIndex) => {
                        const lineDiv = document.createElement('div');
                        lineDiv.className = 'welcome-line';
                        
                        // En móviles, ajustar márgenes y tamaño de fuente
                        if (isMobile) {
                            lineDiv.style.marginBottom = '15px';
                            lineDiv.style.fontSize = isSmallMobile ? '1.1rem' : '1.2rem';
                            lineDiv.style.lineHeight = '1.4';
                            lineDiv.style.width = '100%';
                        }
                        
                        // Dividir la línea en texto y emojis
                        let lastIndex = 0;
                        let match;
                        let textParts = [];
                        
                        // Encontrar todos los emojis en la línea
                        while ((match = emojiRegex.exec(line)) !== null) {
                            // Agregar texto antes del emoji
                            if (match.index > lastIndex) {
                                textParts.push({
                                    text: line.substring(lastIndex, match.index),
                                    isEmoji: false
                                });
                            }
                            
                            // Agregar el emoji
                            textParts.push({
                                text: match[0],
                                isEmoji: true
                            });
                            
                            lastIndex = match.index + match[0].length;
                        }
                        
                        // Agregar texto restante después del último emoji
                        if (lastIndex < line.length) {
                            textParts.push({
                                text: line.substring(lastIndex),
                                isEmoji: false
                            });
                        }
                        
                        // Si no se encontraron emojis, usar la línea completa
                        if (textParts.length === 0) {
                            textParts.push({
                                text: line,
                                isEmoji: false
                            });
                        }
                        
                        // Procesar cada parte (texto o emoji)
                        textParts.forEach(part => {
                            if (part.isEmoji) {
                                // Crear elemento para emoji
                                const emojiSpan = document.createElement('span');
                                emojiSpan.className = 'welcome-emoji';
                                emojiSpan.textContent = part.text;
                                // Ajustar tamaño en móviles
                                if (isMobile) {
                                    emojiSpan.style.fontSize = isSmallMobile ? '1.1rem' : '1.2rem';
                                }
                                lineDiv.appendChild(emojiSpan);
                            } else {
                                // Dividir el texto en palabras
                                const words = part.text.split(' ');
                                words.forEach((word, wordIndex) => {
                                    if (word) {
                                        const wordSpan = document.createElement('span');
                                        wordSpan.className = 'welcome-word';
                                        wordSpan.textContent = word + (wordIndex < words.length - 1 ? ' ' : '');
                                        // Ajustar tamaño en móviles
                                        if (isMobile) {
                                            wordSpan.style.fontSize = isSmallMobile ? '1.1rem' : '1.2rem';
                                        }
                                        lineDiv.appendChild(wordSpan);
                                    }
                                });
                            }
                        });
                        
                        welcomeContent.appendChild(lineDiv);
                    });
                    
                    // Crear algunas chispas decorativas
                    createSparkles();
                    
                    // Animar este grupo
                    animateCurrentGroup(groupIndex);
                }

                // Función para animar el grupo actual
                function animateCurrentGroup(groupIndex) {
                    const words = welcomeContent.querySelectorAll('.welcome-word');
                    const emojis = welcomeContent.querySelectorAll('.welcome-emoji');
                    let wordIndex = 0;
                    let emojiIndex = 0;

                    // Animar palabras una por una con una velocidad moderada
                    const wordInterval = setInterval(() => {
                        if (wordIndex < words.length) {
                            const word = words[wordIndex];
                            word.classList.add('visible');
                            
                            // Agregar transición suave para una animación más natural
                            word.style.opacity = '0';
                            word.style.transform = 'translateY(10px)';
                            
                            // Forzar un reflow antes de aplicar la transición
                            word.offsetHeight;
                            
                            word.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                            word.style.opacity = '1';
                            word.style.transform = 'translateY(0)';
                            
                            wordIndex++;
                            
                            // Crear algunas chispas ocasionalmente
                            if (wordIndex % 10 === 0) {
                                createSparkles();
                            }
                        } else {
                            clearInterval(wordInterval);
                            
                            // Si es el último grupo, mostrar el texto final destacado
                            if (groupIndex === textGroups.length - 1) {
                                setTimeout(() => {
                                    highlightLastLine();
                                }, 1500);
                            } else {
                                // Pasar al siguiente grupo después de una pausa
                                setTimeout(() => {
                                    currentGroup++;
                                    showTextGroup(currentGroup);
                                }, 2500); // Pausa entre grupos - aumentada a 2500ms
                            }
                        }
                    }, 450); // Cambiado a 450ms para una transición más lenta
                    
                    // Animar emojis con un retraso mayor que las palabras
                    const emojiInterval = setInterval(() => {
                        if (emojiIndex < emojis.length) {
                            const emoji = emojis[emojiIndex];
                            emoji.classList.add('visible');
                            
                            // Agregar transición suave para emojis
                            emoji.style.opacity = '0';
                            emoji.style.transform = 'scale(0.7)';
                            
                            // Forzar un reflow antes de aplicar la transición
                            emoji.offsetHeight;
                            
                            emoji.style.transition = 'opacity 0.4s ease-out, transform 0.4s ease-out';
                            emoji.style.opacity = '1';
                            emoji.style.transform = 'scale(1)';
                            
                            emojiIndex++;
                        } else {
                            clearInterval(emojiInterval);
                        }
                    }, 300); // Mantenemos 300ms para emojis
                }

                // Función para destacar la última línea "¡Ayúdenme a contar!"
                function highlightLastLine() {
                    // Primero resaltamos solo la última línea
                    const welcomeLines = welcomeContent.querySelectorAll('.welcome-line');
                    
                    // Solo mantener visible la última línea
                    welcomeLines.forEach((line, index) => {
                        if (index !== welcomeLines.length - 1) {
                            // Ocultar todas menos la última
                            line.style.opacity = '0';
                            line.style.transform = 'translateY(-20px)';
                            line.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                        } else {
                            // Detectar si es móvil para ajustar el tamaño
                            const isMobile = window.innerWidth <= 480;
                            
                            // Preservar el contenido original que incluye emojis
                            const originalContent = line.innerHTML;
                            
                            // Extraer emojis usando regex
                            const emojiRegex = /[\p{Emoji}]/gu;
                            
                            // Reemplazar el contenido separando texto y emojis
                            let newContent = '';
                            let lastIndex = 0;
                            let match;
                            
                            // Dividir la línea en texto y emojis
                            const originalText = line.textContent;
                            
                            // Encontrar todos los emojis en la línea
                            while ((match = emojiRegex.exec(originalText)) !== null) {
                                // Agregar texto antes del emoji con gradiente
                                if (match.index > lastIndex) {
                                    const textBefore = originalText.substring(lastIndex, match.index);
                                    newContent += `<span class="gradient-text">${textBefore}</span>`;
                                }
                                
                                // Agregar el emoji sin modificar
                                newContent += match[0];
                                
                                lastIndex = match.index + match[0].length;
                            }
                            
                            // Agregar texto restante después del último emoji
                            if (lastIndex < originalText.length) {
                                const textAfter = originalText.substring(lastIndex);
                                newContent += `<span class="gradient-text">${textAfter}</span>`;
                            }
                            
                            // Si no hay emojis, aplicar gradiente a todo el texto
                            if (newContent === '') {
                                newContent = `<span class="gradient-text">${originalText}</span>`;
                            }
                            
                            // Actualizar el contenido de la línea
                            line.innerHTML = newContent;
                            
                            // Destacar la última línea
                            line.style.position = 'absolute';
                            line.style.top = '50%';
                            line.style.left = '0';
                            line.style.right = '0';
                            line.style.textAlign = 'center';
                            line.style.transform = 'translateY(-50%)';
                            // Tamaño más pequeño para móviles
                            line.style.fontSize = isMobile ? '1.6rem' : '2rem';
                            line.style.padding = isMobile ? '0 10px' : '0';
                            line.style.textShadow = '2px 2px 5px rgba(0, 0, 0, 0.1)';
                            line.style.transition = 'all 0.8s ease';
                        }
                    });
                    
                    // Animar chispas finales
                    createSparkles();
                    
                    // Iniciar cuenta regresiva después de un momento
                    setTimeout(() => {
                        // Ocultar mensaje de bienvenida y mostrar cuenta regresiva
                        const welcomeMessage = document.getElementById('welcomeMessage');
                        welcomeMessage.style.opacity = '0';
                        welcomeMessage.style.transition = 'opacity 0.8s ease';
                        
                        setTimeout(() => {
                            welcomeMessage.style.display = 'none';
                            startCountdown();
                        }, 800);
                    }, 2500);
                }

                // Iniciar con el primer grupo
                showTextGroup(0);
            }, 500);
        }

        // Función para crear chispas decorativas
        function createSparkles() {
            const welcomeContent = document.getElementById('welcomeContent');
            const contentRect = welcomeContent.getBoundingClientRect();

            // Crear 15 chispas aleatorias
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';

                    // Posición aleatoria alrededor del contenido
                    const posX = Math.random() * contentRect.width;
                    const posY = Math.random() * contentRect.height;
                    sparkle.style.left = `${posX}px`;
                    sparkle.style.top = `${posY}px`;

                    // Retraso aleatorio para la animación
                    sparkle.style.animationDelay = `${Math.random() * 2}s`;

                    welcomeContent.appendChild(sparkle);

                    // Eliminar la chispa después de la animación
                    setTimeout(() => {
                        sparkle.remove();
                    }, 2000);
                }, i * 500 + Math.random() * 1000);
            }
        }

        // Función para la cuenta regresiva
        function startCountdown() {
            countdown.style.display = 'block';
            const countdownMessage = document.getElementById('countdownMessage');

            // Cambiar el fondo a blanco durante la cuenta regresiva
            document.body.classList.add('countdown-active');

            let count = 10;
            countdown.textContent = count;

            // Aplicar el efecto de pulso al número inicial (10)
            countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
            setTimeout(() => {
                countdown.style.animation = 'color-change 1s linear infinite alternate';
            }, 750);

            // Alternamos colores para los números
            let colorToggle = true;

            const interval = setInterval(() => {
                count--;
                countdown.textContent = count;

                // Alternamos entre celeste y rosado manualmente para cada número
                // (esto es adicional a la animación)
                if (colorToggle) {
                    countdown.style.color = '#74b9ff'; // Celeste
                    countdown.style.textShadow = '2px 2px 10px rgba(116, 185, 255, 0.5)';
                } else {
                    countdown.style.color = '#fd79a8'; // Rosado
                    countdown.style.textShadow = '2px 2px 10px rgba(253, 121, 168, 0.5)';
                }
                colorToggle = !colorToggle;

                // Escala para efecto de pulso usando animación
                countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
                setTimeout(() => {
                    countdown.style.animation = 'color-change 1s linear infinite alternate';
                }, 750);

                if (count === 0) {
                    clearInterval(interval);

                    // Número aleatorio de repeticiones para el 0 (entre 0 y 4)
                    const extraZeros = Math.floor(Math.random() * 5);
                    let zerosShown = 0;

                    const showReveal = () => {
                        // Ocultamos la cuenta regresiva
                        setTimeout(() => {
                            countdown.style.display = 'none';

                            // Restauramos el fondo gradiente
                            document.body.classList.remove('countdown-active');

                            // Mostramos el mensaje de revelación
                            revealMessage.style.display = 'flex';

                            // Animaciones adicionales
                            createFlowers();
                            createHearts();
                            createBalloons();
                            createButterflies();
                            createRibbons();
                            createClouds();

                            // Lanzamos el confeti al mostrar el mensaje de niña
                            runConfettiShower();
                        }, 1000);
                    };

                    if (extraZeros > 0) {
                        // Si hay repeticiones extra, mostramos los ceros adicionales
                        const zeroInterval = setInterval(() => {
                            // Aplicar el efecto de pulso en cada repetición
                            countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
                            setTimeout(() => {
                                countdown.style.animation = 'color-change 1s linear infinite alternate';
                            }, 750);

                            zerosShown++;
                            if (zerosShown >= extraZeros) {
                                clearInterval(zeroInterval);
                                showReveal();
                            }
                        }, 1000);
                    } else {
                        // Si no hay repeticiones, mostramos directamente la revelación
                        showReveal();
                    }
                }
            }, 1000);
        }

        // Función para resetear animaciones
        function resetAnimation() {
            // Ocultamos el mensaje de revelación
            revealMessage.style.display = 'none';

            // Ocultamos la cuenta regresiva
            countdown.style.display = 'none';

            // Ocultamos el mensaje de bienvenida
            document.getElementById('welcomeMessage').style.display = 'none';

            // Asegurarnos de restaurar el fondo original
            document.body.classList.remove('countdown-active');

            // Mostramos la tarjeta inicial
            card.style.display = 'block';
            card.style.opacity = 1;

            // Eliminamos todas las flores, cintas, nubes, etc.
            document.querySelectorAll('.flower, .ribbon, .cloud, .balloon, .butterfly').forEach(el => {
                el.remove();
            });

            // Ocultamos y limpiamos los corazones
            heartsContainer.style.display = 'none';
            heartsContainer.innerHTML = '';
        }
    </script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Revelación</title>
    <!-- Agregamos la biblioteca de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #ff9fcf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease;
        }

        body.countdown-active {
            background: white;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        .card {
            background: linear-gradient(to bottom, #fff8f8, #f0f8ff);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            transition: all 0.5s ease;
            border: 3px dashed;
            border-image: linear-gradient(45deg, #74b9ff, #fd79a8) 1;
        }

        .card h1 {
            background: linear-gradient(45deg, #74b9ff, #fd79a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .card p {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .reveal-btn {
            background: linear-gradient(45deg, #74b9ff, #fd79a8);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .reveal-btn:hover {
            background: linear-gradient(45deg, #0984e3, #e84393);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .countdown {
            font-size: 8rem;
            font-weight: bold;
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            animation: color-change 1s linear infinite alternate;
            transform-origin: center;
        }

        @keyframes color-change {
            0% { color: #74b9ff; }
            100% { color: #fd79a8; }
        }

        @keyframes pulse-animation {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .countdown-message {
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            width: 80%;
            max-width: 800px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.1);
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        .highlight-blue {
            color: #74b9ff;
            text-shadow: 1px 1px 3px rgba(116, 185, 255, 0.5);
        }

        .highlight-pink {
            color: #fd79a8;
            text-shadow: 1px 1px 3px rgba(253, 121, 168, 0.5);
        }

        .reveal-message {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .reveal-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f8a5c2 0%, #c56cf0 100%);
            z-index: 15;
            animation: bg-change 5s infinite alternate;
        }

        @keyframes bg-change {
            0% { background: linear-gradient(135deg, #f8a5c2 0%, #c56cf0 100%); }
            100% { background: linear-gradient(135deg, #fd79a8 0%, #a55eea 100%); }
        }

        .reveal-message h1 {
            font-size: 5rem;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #e84393;
            animation: pulse 2s infinite;
            position: relative;
            z-index: 50;
        }

        .reveal-message p {
            font-size: 2rem;
            color: #fff;
            margin-top: 0;
            text-shadow: 2px 2px 0px #c56cf0;
            position: relative;
            z-index: 50;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Estilos para el confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            z-index: 60;
            animation: confetti-fall 5s linear infinite;
        }

        @keyframes confetti-fall {
            0% {
                top: -5%;
                transform: rotate(0deg) translateX(0);
                opacity: 1;
            }
            100% {
                top: 100%;
                transform: rotate(360deg) translateX(calc(20vw * var(--drift)));
                opacity: 0;
            }
        }

        .flower {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 40;
            opacity: 0;
            animation: fall 10s linear infinite, rotate 10s linear infinite;
        }

        @keyframes fall {
            0% {
                top: -20%;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 120%;
                opacity: 0;
            }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hearts-container {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 30;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23fd79a8' d='M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            animation: float 6s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-800px) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 80px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 700'%3E%3Cpath fill='%23fd79a8' d='M250,0 C350,0 450,100 450,250 C450,400 350,550 250,550 C150,550 50,400 50,250 C50,100 150,0 250,0 Z'%3E%3C/path%3E%3Cpath fill='%23666' d='M250,550 L260,700 L240,700 L250,550 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 35;
            animation: balloon-float 15s ease-in infinite;
        }

        @keyframes balloon-float {
            0% {
                transform: translate(0, 100vh);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translate(calc(20vw - 40px), -100px);
                opacity: 0;
            }
        }

        .butterfly {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath fill='%23fd79a8' d='M50,30 C60,10 85,5 90,25 C95,45 70,50 50,30 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M50,30 C40,10 15,5 10,25 C5,45 30,50 50,30 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M50,30 L50,60 Z'%3E%3C/path%3E%3Cpath fill='%23fd79a8' d='M40,65 C50,55 50,55 60,65 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 35;
            animation: butterfly-fly 20s linear infinite;
        }

        @keyframes butterfly-fly {
            0% {
                transform: translate(-100px, 50vh) scale(0.8);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            45% {
                transform: translate(30vw, 30vh) scale(1.2) rotate(20deg);
            }
            50% {
                transform: translate(50vw, 40vh) scale(1) rotate(-20deg);
            }
            80% {
                transform: translate(80vw, 20vh) scale(1.2) rotate(20deg);
                opacity: 0.9;
            }
            100% {
                transform: translate(120vw, 10vh) scale(0.8) rotate(-20deg);
                opacity: 0;
            }
        }

        .ribbon {
            position: absolute;
            width: 40px;
            height: 150px;
            background-color: #fd79a8;
            opacity: 0;
            z-index: 25;
            transform-origin: center top;
            animation: ribbon-fall 8s ease-in infinite;
        }

        @keyframes ribbon-fall {
            0% {
                transform: translateY(-150px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .cloud {
            position: absolute;
            width: 150px;
            height: 80px;
            background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'%3E%3Cpath fill='%23fff' d='M20,70 Q0,70 0,50 Q0,30 20,30 Q30,5 60,20 Q80,0 110,20 Q130,5 150,20 Q185,15 190,40 Q200,50 190,70 Z'%3E%3C/path%3E%3C/svg%3E");
            background-repeat: no-repeat;
            opacity: 0.7;
            z-index: 20;
            animation: cloud-float 40s linear infinite;
        }

        @keyframes cloud-float {
            0% {
                transform: translateX(-200px);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateX(calc(100vw + 200px));
                opacity: 0;
            }
        }

        /* Agregamos un canvas para el confeti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 70;
            pointer-events: none;
        }

        /* Media queries para responsividad */
        @media (max-width: 768px) {
            .card {
                padding: 30px;
                max-width: 85%;
            }

            .card h1 {
                font-size: 2rem;
            }

            .card p {
                font-size: 1rem;
                margin-bottom: 20px;
            }

            .reveal-btn {
                padding: 12px 25px;
                font-size: 1rem;
            }

            .countdown {
                font-size: 6rem;
            }
            
            .countdown-message {
                font-size: 1.2rem;
                width: 90%;
                top: 60%;
            }

            .reveal-message h1 {
                font-size: 3.5rem;
            }

            .reveal-message p {
                font-size: 1.5rem;
            }

            .flower, .heart, .balloon, .butterfly, .ribbon {
                transform-origin: center;
                transform: scale(0.8);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px;
                max-width: 90%;
            }

            .card h1 {
                font-size: 1.8rem;
            }

            .card p {
                font-size: 0.9rem;
                margin-bottom: 15px;
            }

            .reveal-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .countdown {
                font-size: 5rem;
            }
            
            .countdown-message {
                font-size: 1rem;
                width: 95%;
                top: 65%;
                line-height: 1.5;
            }

            .reveal-message h1 {
                font-size: 2.8rem;
                margin-bottom: 10px;
            }

            .reveal-message p {
                font-size: 1.2rem;
            }

            .flower, .heart, .balloon, .butterfly, .ribbon {
                transform: scale(0.6);
            }

            .cloud {
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Mi Revelación</h1>
            <p>Haz clic en el botón para descubrir una sorpresa muy especial</p>
            <button class="reveal-btn">Revelar</button>
        </div>
    </div>
    
    <div class="countdown" id="countdown"></div>
    
    <div class="countdown-message" id="countdownMessage"></div>
    
    <div class="reveal-message" id="revealMessage">
        <div class="reveal-background"></div>
        <h1>¡Soy Niña!</h1>
        <p>💕 ¡Una princesita viene en camino! 💕</p>
    </div>

    <div class="hearts-container" id="heartsContainer"></div>
    
    <!-- Agregamos un canvas para el confeti -->
    <canvas id="confetti-canvas"></canvas>

    <script>
        // Limpiar cualquier animación o elemento previo al cargar la página
        window.onload = function() {
            // Reiniciar todos los elementos a su estado inicial
            resetAnimation();
        };

        const revealBtn = document.querySelector('.reveal-btn');
        const card = document.querySelector('.card');
        const countdown = document.getElementById('countdown');
        const revealMessage = document.getElementById('revealMessage');
        const heartsContainer = document.getElementById('heartsContainer');
        const body = document.body;

        // Configuración del confeti con colores para niña
        const confettiColors = [
            '#fd79a8', // Rosa
            '#f8a5c2', // Rosa claro
            '#e84393', // Rosa fuerte
            '#fab1a0', // Coral
            '#ff9ff3', // Rosa pastel
            '#ffeaa7', // Amarillo claro
            '#fff',    // Blanco
            '#dfe6e9'  // Gris muy claro
        ];

        // Función para lanzar confeti en cascada
        function runConfettiShower() {
            // Crear una instancia de confeti
            const myConfetti = confetti.create(document.getElementById('confetti-canvas'), {
                resize: true,
                useWorker: true
            });

            // Duración total de la animación en milisegundos
            const animationDuration = 8000;
            // Intensidad del confeti (ajustar según tamaño de pantalla)
            const intensity = window.innerWidth < 768 ? 60 : 80;
            // Ajustar cantidad de partículas según tamaño de pantalla
            const particleMultiplier = window.innerWidth < 768 ? 0.7 : 1;
            
            // Función para crear una explosión de confeti
            function fireConfetti(particleRatio, opts) {
                myConfetti({
                    particleCount: Math.floor(200 * particleRatio * particleMultiplier),
                    spread: window.innerWidth < 768 ? 80 : 100,
                    origin: { y: 0.6 },
                    colors: confettiColors,
                    ...opts
                });
            }

            // Explosión inicial grande
            fireConfetti(1, {
                spread: 180,
                startVelocity: 45,
                gravity: 1,
                scalar: 1.2,
                drift: 0,
                ticks: 300
            });

            // Más confeti desde arriba
            setTimeout(() => {
                fireConfetti(0.5, {
                    spread: 120,
                    startVelocity: 35,
                    decay: 0.91,
                    scalar: 0.8,
                    origin: { y: 0 }
                });
            }, 200);

            // Confeti desde la izquierda
            setTimeout(() => {
                fireConfetti(0.3, {
                    spread: 120,
                    startVelocity: 45,
                    decay: 0.92,
                    scalar: 1,
                    origin: { x: 0, y: 0.5 }
                });
            }, 400);

            // Confeti desde la derecha
            setTimeout(() => {
                fireConfetti(0.3, {
                    spread: 120,
                    startVelocity: 45,
                    decay: 0.92,
                    scalar: 1,
                    origin: { x: 1, y: 0.5 }
                });
            }, 600);

            // Explosión central con más confeti
            setTimeout(() => {
                fireConfetti(0.7, {
                    spread: 140,
                    decay: 0.91,
                    scalar: 1.2,
                    origin: { y: 0.5 }
                });
            }, 1000);

            // Explosión final
            setTimeout(() => {
                fireConfetti(0.6, {
                    spread: 160,
                    decay: 0.91,
                    scalar: 1.2
                });
            }, 2500);

            // Confeti continuo durante toda la duración
            let intervalId = setInterval(() => {
                fireConfetti(0.1, {
                    spread: 120,
                    startVelocity: 30,
                    decay: 0.92,
                    scalar: 0.7,
                    origin: { y: Math.random() - 0.2, x: Math.random() }
                });
            }, 200);

            // Detener el confeti después de la duración establecida
            setTimeout(() => {
                clearInterval(intervalId);
                // Usar el método stop() para limpiar partículas restantes
                setTimeout(() => {
                    myConfetti.reset();
                }, 3000);
            }, animationDuration);
        }

        // Función para crear flores animadas
        function createFlowers() {
            // Ajustar cantidad de flores según tamaño de pantalla
            const flowerCount = window.innerWidth < 768 ? 20 : 30;
            
            for (let i = 0; i < flowerCount; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.classList.add('flower');
                    
                    // Alternamos entre diferentes tipos de flores
                    const flowerType = i % 3;
                    let flowerSVG;
                    
                    if (flowerType === 0) {
                        flowerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="20" fill="#fd79a8"/>
                            <circle cx="50" cy="50" r="10" fill="#fab1a0"/>
                            <circle cx="50" cy="20" r="15" fill="#fd79a8"/>
                            <circle cx="80" cy="50" r="15" fill="#fd79a8"/>
                            <circle cx="50" cy="80" r="15" fill="#fd79a8"/>
                            <circle cx="20" cy="50" r="15" fill="#fd79a8"/>
                        </svg>`;
                    } else if (flowerType === 1) {
                        flowerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="15" fill="#e84393"/>
                            <path d="M50,15 Q60,30 50,50 Q40,30 50,15 Z" fill="#fd79a8"/>
                            <path d="M85,50 Q70,60 50,50 Q70,40 85,50 Z" fill="#fd79a8"/>
                            <path d="M50,85 Q40,70 50,50 Q60,70 50,85 Z" fill="#fd79a8"/>
                            <path d="M15,50 Q30,40 50,50 Q30,60 15,50 Z" fill="#fd79a8"/>
                        </svg>`;
                    } else {
                        flowerSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="12" fill="#ffa69e"/>
                            <circle cx="60" cy="40" r="12" fill="#ffa69e"/>
                            <circle cx="60" cy="60" r="12" fill="#ffa69e"/>
                            <circle cx="40" cy="60" r="12" fill="#ffa69e"/>
                            <circle cx="40" cy="40" r="12" fill="#ffa69e"/>
                            <circle cx="50" cy="50" r="8" fill="#e84393"/>
                        </svg>`;
                    }
                    
                    flower.innerHTML = flowerSVG;
                    
                    // Posición y animación aleatoria
                    flower.style.left = `${Math.random() * 100}%`;
                    flower.style.animationDuration = `${Math.random() * 5 + 7}s`;
                    flower.style.animationDelay = `${Math.random() * 5}s`;
                    
                    body.appendChild(flower);
                }, i * 200);
            }
        }

        // Función para crear corazones animados
        function createHearts() {
            heartsContainer.style.display = 'block';
            // Ajustar cantidad de corazones según tamaño de pantalla
            const heartCount = window.innerWidth < 768 ? 25 : 40;
            
            for (let i = 0; i < heartCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    
                    // Tamaño y posición aleatoria
                    const size = Math.random() * 30 + 10;
                    heart.style.width = `${size}px`;
                    heart.style.height = `${size}px`;
                    heart.style.left = `${Math.random() * 100}%`;
                    heart.style.bottom = '0';
                    
                    // Animación aleatoria
                    heart.style.animationDuration = `${Math.random() * 4 + 4}s`;
                    heart.style.animationDelay = `${Math.random() * 5}s`;
                    
                    heartsContainer.appendChild(heart);
                }, i * 100);
            }
        }

        // Función para crear globos
        function createBalloons() {
            // Ajustar cantidad de globos según tamaño de pantalla
            const balloonCount = window.innerWidth < 768 ? 6 : 10;
            
            for (let i = 0; i < balloonCount; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.classList.add('balloon');
                    
                    // Posición aleatoria
                    balloon.style.left = `${Math.random() * 100}%`;
                    
                    // Animación aleatoria
                    balloon.style.animationDuration = `${Math.random() * 5 + 12}s`;
                    balloon.style.animationDelay = `${Math.random() * 8}s`;
                    
                    body.appendChild(balloon);
                }, i * 800);
            }
        }

        // Función para crear mariposas
        function createButterflies() {
            // Ajustar cantidad de mariposas según tamaño de pantalla
            const butterflyCount = window.innerWidth < 768 ? 5 : 8;
            
            for (let i = 0; i < butterflyCount; i++) {
                setTimeout(() => {
                    const butterfly = document.createElement('div');
                    butterfly.classList.add('butterfly');
                    
                    // Posición aleatoria
                    butterfly.style.top = `${Math.random() * 80}%`;
                    
                    // Animación aleatoria
                    butterfly.style.animationDuration = `${Math.random() * 8 + 15}s`;
                    butterfly.style.animationDelay = `${Math.random() * 5}s`;
                    
                    body.appendChild(butterfly);
                }, i * 1000);
            }
        }

        // Función para crear cintas
        function createRibbons() {
            // Ajustar cantidad de cintas según tamaño de pantalla
            const ribbonCount = window.innerWidth < 768 ? 10 : 15;
            
            for (let i = 0; i < ribbonCount; i++) {
                setTimeout(() => {
                    const ribbon = document.createElement('div');
                    ribbon.classList.add('ribbon');
                    
                    // Ancho aleatorio
                    const width = Math.random() * 10 + 5;
                    ribbon.style.width = `${width}px`;
                    
                    // Color aleatorio (tonos rosados)
                    const colors = ['#fd79a8', '#f78fb3', '#e84393', '#ff9ff3', '#f8a5c2'];
                    ribbon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Posición aleatoria
                    ribbon.style.left = `${Math.random() * 100}%`;
                    
                    // Animación aleatoria
                    ribbon.style.animationDuration = `${Math.random() * 4 + 6}s`;
                    ribbon.style.animationDelay = `${Math.random() * 5}s`;
                    
                    body.appendChild(ribbon);
                }, i * 400);
            }
        }

        // Función para crear nubes
        function createClouds() {
            // Ajustar cantidad de nubes según tamaño de pantalla
            const cloudCount = window.innerWidth < 768 ? 3 : 5;
            
            for (let i = 0; i < cloudCount; i++) {
                setTimeout(() => {
                    const cloud = document.createElement('div');
                    cloud.classList.add('cloud');
                    
                    // Tamaño aleatorio
                    const scale = Math.random() * 0.7 + 0.5;
                    cloud.style.transform = `scale(${scale})`;
                    
                    // Posición aleatoria
                    cloud.style.top = `${Math.random() * 50}%`;
                    
                    // Animación aleatoria
                    cloud.style.animationDuration = `${Math.random() * 20 + 30}s`;
                    
                    body.appendChild(cloud);
                }, i * 2000);
            }
        }

        // Función para la cuenta regresiva
        function startCountdown() {
            card.style.opacity = 0;
            setTimeout(() => {
                card.style.display = 'none';
                countdown.style.display = 'block';
                const countdownMessage = document.getElementById('countdownMessage');
                
                // Cambiar el fondo a blanco durante la cuenta regresiva
                document.body.classList.add('countdown-active');
                
                let count = 10;
                countdown.textContent = count;
                
                // Aplicar el efecto de pulso al número inicial (10)
                countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
                setTimeout(() => {
                    countdown.style.animation = 'color-change 1s linear infinite alternate';
                }, 750);
                
                // Alternamos colores para los números
                let colorToggle = true;
                
                // Definimos los mensajes para cada par de números
                const countdownMessages = {
                    '10-9': "¡<span class='highlight-blue'>Hola</span> <span class='highlight-pink'>mamá</span> <span class='highlight-blue'>y</span> <span class='highlight-pink'>papá</span>! <span class='highlight-blue'>Estoy</span> <span class='highlight-pink'>muy</span> <span class='highlight-blue'>emocionado</span> <span class='highlight-pink'>porque</span> <span class='highlight-blue'>pronto</span> <span class='highlight-pink'>sabrán</span> <span class='highlight-blue'>quién</span> <span class='highlight-pink'>soy</span>...",
                    '8-7': "<span class='highlight-blue'>He</span> <span class='highlight-pink'>estado</span> <span class='highlight-blue'>guardando</span> <span class='highlight-pink'>este</span> <span class='highlight-blue'>secreto</span> <span class='highlight-pink'>por</span> <span class='highlight-blue'>meses</span>, <span class='highlight-pink'>¿están</span> <span class='highlight-blue'>listos</span> <span class='highlight-pink'>para</span> <span class='highlight-blue'>descubrirlo</span>?",
                    '6-5': "<span class='highlight-blue'>Mis</span> <span class='highlight-pink'>manitas</span> <span class='highlight-blue'>están</span> <span class='highlight-pink'>tapando</span> <span class='highlight-blue'>mis</span> <span class='highlight-pink'>ojitos</span>... <span class='highlight-blue'>¡la</span> <span class='highlight-pink'>sorpresa</span> <span class='highlight-blue'>está</span> <span class='highlight-pink'>casi</span> <span class='highlight-blue'>lista</span>!",
                    '4-3': "<span class='highlight-blue'>Mi</span> <span class='highlight-pink'>corazoncito</span> <span class='highlight-blue'>late</span> <span class='highlight-pink'>fuerte</span> <span class='highlight-blue'>mientras</span> <span class='highlight-pink'>espero</span> <span class='highlight-blue'>el</span> <span class='highlight-pink'>momento</span> <span class='highlight-blue'>de</span> <span class='highlight-pink'>revelarme</span>...",
                    '2-1': "¡<span class='highlight-blue'>Respiren</span> <span class='highlight-pink'>profundo</span>! <span class='highlight-blue'>En</span> <span class='highlight-pink'>unos</span> <span class='highlight-blue'>segundos</span> <span class='highlight-pink'>sabrán</span> <span class='highlight-blue'>si</span> <span class='highlight-pink'>comprarán</span> <span class='highlight-blue'>vestiditos</span> <span class='highlight-pink'>o</span> <span class='highlight-blue'>corbatitas</span>..."
                };
                
                // Mostrar mensaje inicial
                countdownMessage.innerHTML = countdownMessages['10-9'];
                countdownMessage.style.display = 'block';
                
                const interval = setInterval(() => {
                    count--;
                    countdown.textContent = count;
                    
                    // Mostrar mensajes según los pares de números
                    if (count === 9 || count === 8) {
                        countdownMessage.innerHTML = countdownMessages['10-9'];
                    } else if (count === 7 || count === 6) {
                        countdownMessage.innerHTML = countdownMessages['8-7'];
                    } else if (count === 5 || count === 4) {
                        countdownMessage.innerHTML = countdownMessages['6-5'];
                    } else if (count === 3 || count === 2) {
                        countdownMessage.innerHTML = countdownMessages['4-3'];
                    } else if (count === 1 || count === 0) {
                        countdownMessage.innerHTML = countdownMessages['2-1'];
                    }
                    
                    // Alternamos entre celeste y rosado manualmente para cada número
                    // (esto es adicional a la animación)
                    if (colorToggle) {
                        countdown.style.color = '#74b9ff'; // Celeste
                        countdown.style.textShadow = '2px 2px 10px rgba(116, 185, 255, 0.5)';
                    } else {
                        countdown.style.color = '#fd79a8'; // Rosado
                        countdown.style.textShadow = '2px 2px 10px rgba(253, 121, 168, 0.5)';
                    }
                    colorToggle = !colorToggle;
                    
                    // Escala para efecto de pulso usando animación
                    countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
                    setTimeout(() => {
                        countdown.style.animation = 'color-change 1s linear infinite alternate';
                    }, 750);
                    
                    if (count === 0) {
                        clearInterval(interval);
                        
                        // Número aleatorio de repeticiones para el 0 (entre 0 y 4)
                        const extraZeros = Math.floor(Math.random() * 5);
                        let zerosShown = 0;
                        
                        const showReveal = () => {
                            // Ocultamos la cuenta regresiva y el mensaje
                            setTimeout(() => {
                                countdown.style.display = 'none';
                                countdownMessage.style.display = 'none';
                                
                                // Restauramos el fondo gradiente
                                document.body.classList.remove('countdown-active');
                                
                                // Mostramos el mensaje de revelación
                                revealMessage.style.display = 'flex';
                                
                                // Animaciones adicionales
                                createFlowers();
                                createHearts();
                                createBalloons();
                                createButterflies();
                                createRibbons();
                                createClouds();
                                
                                // Lanzamos el confeti al mostrar el mensaje de niña
                                runConfettiShower();
                            }, 1000);
                        };
                        
                        if (extraZeros > 0) {
                            // Si hay repeticiones extra, mostramos los ceros adicionales
                            const zeroInterval = setInterval(() => {
                                // Aplicar el efecto de pulso en cada repetición
                                countdown.style.animation = 'color-change 1s linear infinite alternate, pulse-animation 0.8s ease-in-out';
                                setTimeout(() => {
                                    countdown.style.animation = 'color-change 1s linear infinite alternate';
                                }, 750);
                                
                                zerosShown++;
                                if (zerosShown >= extraZeros) {
                                    clearInterval(zeroInterval);
                                    showReveal();
                                }
                            }, 1000);
                        } else {
                            // Si no hay repeticiones, mostramos directamente la revelación
                            showReveal();
                        }
                    }
                }, 1000);
            }, 500);
        }

        // Función para resetear animaciones
        function resetAnimation() {
            // Ocultamos el mensaje de revelación
            revealMessage.style.display = 'none';
            
            // Ocultamos la cuenta regresiva
            countdown.style.display = 'none';
            
            // Asegurarnos de restaurar el fondo original
            document.body.classList.remove('countdown-active');
            
            // Mostramos la tarjeta inicial
            card.style.display = 'block';
            card.style.opacity = 1;
            
            // Eliminamos todas las flores, cintas, nubes, etc.
            document.querySelectorAll('.flower, .ribbon, .cloud, .balloon, .butterfly').forEach(el => {
                el.remove();
            });
            
            // Ocultamos y limpiamos los corazones
            heartsContainer.style.display = 'none';
            heartsContainer.innerHTML = '';
        }

        // Evento click del botón de revelación
        revealBtn.addEventListener('click', () => {
            startCountdown();
        });
    </script>
</body>
</html>
